<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Exam</title>
    <style>
        :root {
            --text-color: #333;
            --card-bg: rgba(255, 255, 255, 0.92);
            --border-color: #ddd;
        }

        [data-theme="dark"] {
            --text-color: #f4f4f4;
            --card-bg: rgba(30, 30, 30, 0.9);
            --border-color: #444;
        }

        /* Animated RGB Background Effect */
        body { 
            font-family: sans-serif; 
            padding: 10px; 
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fad0c4, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color); 
            transition: 0.3s; 
        }

        [data-theme="dark"] body {
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a1a2e, #16213e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
        }

        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .container, .paper-card, .top-bar { 
            border: 2px solid transparent;
            animation: rgbBorder 6s infinite linear;
        }

        @keyframes rgbBorder {
            0% { border-color: #ff0055; box-shadow: 0 0 12px rgba(255, 0, 85, 0.3); }
            33% { border-color: #00ff66; box-shadow: 0 0 12px rgba(0, 255, 102, 0.3); }
            66% { border-color: #0088ff; box-shadow: 0 0 12px rgba(0, 136, 255, 0.3); }
            100% { border-color: #ff0055; box-shadow: 0 0 12px rgba(255, 0, 85, 0.3); }
        }

        .container { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px;
        }

        .timer { font-size: 18px; color: #ff4444; font-weight: bold; margin-bottom: 10px; }
        
        .question-box { 
            margin-bottom: 20px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; 
            text-align: left; 
        }

        .paper-card { 
            background: var(--card-bg);
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: row;
            justify-content: space-between; 
            align-items: center; 
            gap: 10px;
        }

        button { 
            padding: 10px 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        button:hover { opacity: 0.9; }
        
        .mode-btn { 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 6px 12px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
        }

        [data-theme="dark"] .mode-btn {
            background: rgba(255,255,255,0.2);
        }

        a.logout { color: #ff4444; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-top: 20px; }

        @media (max-width: 480px) {
            body { padding: 5px; }
            .top-bar h1 { font-size: 16px !important; }
            .paper-card { flex-direction: column; align-items: stretch; text-align: center; }
            .paper-card button { width: 100%; margin-top: 8px; }
            h2 { font-size: 18px; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="wrapper">
        <div class="top-bar">
            <h1 id="welcomeText" style="margin:0; font-size: 18px;"></h1>
            <button class="mode-btn" onclick="toggleTheme()">🌙 / ☀</button>
        </div>
        
        <div id="selectPaperSection">
            <h2 style="font-size: 18px; text-align: center;">ලිවීමට ඇති ප්‍රශ්න පත්‍ර</h2>
            <div id="availablePapers"><p style="text-align:center;">ප්‍රශ්න පත්‍ර ලෝඩ් වෙමින් පවතී...</p></div>
        </div>

        <div class="container" id="examContainer" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <h2 id="paperTitleHeading" style="font-size: 18px; margin: 5px 0;"></h2>
                <div class="timer" id="timer">කාලය: 00:00</div>
            </div>
            <form id="examForm">
                <div id="questionsList"></div>
                <button type="submit" id="submitBtn" style="width: 100%; margin-top: 10px;">පිළිතුරු භාර දෙන්න</button>
            </form>
            <div id="resultBox" style="display:none; text-align:center;">
                <h2 id="scoreText"></h2>
                <button onclick="location.reload()" style="width: 100%; margin-top: 15px;">ප්‍රශ්න පත්‍ර ලැයිස්තුවට යන්න</button>
            </div>
        </div>
        
        <a href="#" class="logout" onclick="logout()">ඉවත් වන්න (Logout)</a>
    </div>

    <!-- Firebase සහ ළමා උපකරණ ක්‍රියාකාරීත්ව ස්ක්‍රිප්ට් එක -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVwy650kdJpKOBiv6mfjk1oS8h4YtnWHQ",
            authDomain: "onlin--exsam.firebaseapp.com",
            projectId: "onlin--exsam",
            storageBucket: "onlin--exsam.firebasestorage.app",
            messagingSenderId: "621803758229",
            appId: "1:621803758229:web:943bdb53ab2dc30714f19c",
            measurementId: "G-CC2N3NZVXD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.toggleTheme = function() {
            let body = document.body;
            if(body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        }

        if(localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        let student = localStorage.getItem('current_student');
        if(!student) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('welcomeText').innerText = "ආයුබෝවන්, " + student + "!";
        }

        let allPapers = [];

        async function loadOnlinePapers() {
            let availableDiv = document.getElementById('availablePapers');
            try {
                const querySnapshot = await getDocs(collection(db, "papers"));
                if(querySnapshot.empty) {
                    availableDiv.innerHTML = "<p style='text-align:center;'>මේ මොහොතේ ප්‍රශ්න පත්‍ර කිසිවක් සූදානම් කර නැත.</p>";
                    return;
                }

                allPapers = [];
                let html = "";
                querySnapshot.forEach((docSnap) => {
                    let p = docSnap.data();
                    let paperObj = {
                        id: docSnap.id,
                        title: p.title,
                        time: p.time,
                        questions: p.questions
                    };
                    allPapers.push(paperObj);

                    html += `<div class="paper-card">
                        <div style="text-align: left;">
                            <b>${p.title}</b><br>
                            <small>ප්‍රශ්න ගණන: ${p.questions.length}</small>
                        </div>
                        <button onclick="startExam('${paperObj.id}')">පත්‍රය ලියන්න</button>
                    </div>`;
                });
                availableDiv.innerHTML = html;
            } catch (error) {
                console.error("Error loading papers: ", error);
                availableDiv.innerHTML = "<p style='text-align:center; color:red;'>ප්‍රශ්න පත්‍ර ලෝඩ් කරගැනීමේ දෝෂයක් ඇත.</p>";
            }
        }

        loadOnlinePapers();

        let timerId;
        let activeQuestions = [];

        window.startExam = function(paperId) {
            let paper = allPapers.find(p => p.id === paperId);
            if(!paper || !paper.questions || paper.questions.length === 0) {
                alert('මෙම ප්‍රශ්න පත්‍රයේ ප්‍රශ්න නොමැත!');
                return;
            }

            document.getElementById('selectPaperSection').style.display = 'none';
            document.getElementById('examContainer').style.display = 'block';
            document.getElementById('paperTitleHeading').innerText = paper.title;

            activeQuestions = paper.questions;
            let qListDiv = document.getElementById('questionsList');
            let qHtml = "";
            
            activeQuestions.forEach((q, index) => {
                qHtml += `<div class="question-box">
                    <p><b>${index + 1}. ${q.question}</b></p>`;
                q.options.forEach((opt, optIndex) => {
                    qHtml += `<label style="display:block; margin:8px 0; cursor:pointer; font-size: 15px;">
                        <input type="radio" name="q_${index}" value="${optIndex}" required style="transform: scale(1.1); margin-right: 8px;"> ${opt}
                    </label>`;
                });
                qHtml += `</div>`;
            });
            qListDiv.innerHTML = qHtml;

            let timeLeft = paper.time;
            timerId = setInterval(() => {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                document.getElementById('timer').innerText = `කාලය: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                timeLeft--;
                
                if(timeLeft < 0) {
                    clearInterval(timerId);
                    alert('කාලය අවසන්!');
                    submitExam();
                }
            }, 1000);
        }

        document.getElementById('examForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearInterval(timerId);
            submitExam();
        });

        function submitExam() {
            let score = 0;
            activeQuestions.forEach((q, index) => {
                let selected = document.querySelector(`input[name="q_${index}"]:checked`);
                if(selected && parseInt(selected.value) === q.correct) {
                    score++;
                }
            });

            document.getElementById('examForm').style.display = 'none';
            document.getElementById('timer').style.display = 'none';
            let rBox = document.getElementById('resultBox');
            rBox.style.display = 'block';
            document.getElementById('scoreText').innerText = `ඔබේ ලකුණු සංඛ්‍යාව: ${score} / ${activeQuestions.length}`;
        }

        window.logout = function() {
            localStorage.removeItem('current_student');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
